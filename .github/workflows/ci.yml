name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "feat/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend:
    name: Backend Lint, Types & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar o uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: uv sync --all-extras

      - name: Checagem de formatação e linting (Ruff)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Checagem de tipagem estática (Mypy)
        run: uv run mypy src

      - name: Executar testes (Pytest) com cobertura >= 80% (DoD M3/M4/M5)
        run: |
          uv run python src/churn_prediction/models/train.py
          uv run pytest tests/ -v --cov=churn_prediction --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes (Vitest)
        run: npm test

      - name: Build do Frontend (Vite)
        run: npm run build