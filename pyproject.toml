[project]
name = "churn-prediction"
version = "0.1.0"
description = "Modelo de predição de churn de clientes para produção"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evidently>=0.4.19",
    "fastapi>=0.110.0",
    "joblib>=1.3.2",
    "pandas>=2.2.1",
    "pandera[pandas]>=0.18.3",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4.1.post1",
    "shap>=0.44.1",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "uvicorn>=0.27.1",
    "xgboost>=2.0.3",
    "aiokafka>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.3",
    "mypy>=1.9.0",
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.2",
    "seaborn>=0.13.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
ignore = ["E501"]

# Adicione este bloco para ensinar o Ruff a ignorar o "X" maiúsculo
[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["X", "X_*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=churn_prediction --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mypy>=1.9.0",
    "pymdown-extensions>=11.0.2",
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.2",
    "seaborn>=0.13.2",
]
