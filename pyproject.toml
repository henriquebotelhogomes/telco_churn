[project]
name = "churn-prediction"
version = "0.1.0"
description = "Modelo de predição de churn de clientes para produção"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "joblib>=1.3.2",
    "pandas>=2.2.1",
    "pydantic-settings>=2.2.1",
    "pydantic>=2.6.3",
    "scikit-learn>=1.4.1.post1",
    "uvicorn>=0.27.1",
    "xgboost>=2.0.3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.3",
    "mypy>=1.9.0",
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.2",
    "seaborn>=0.13.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
ignore = []

# Adicione este bloco para ensinar o Ruff a ignorar o "X" maiúsculo
[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["X", "X_*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=churn_prediction --cov-report=term-missing --cov-fail-under=60"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "mypy>=1.9.0",
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.2",
    "seaborn>=0.13.2",
]
