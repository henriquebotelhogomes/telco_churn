services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: retainiq-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"

  console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: retainiq-redpanda-console
    depends_on:
      - redpanda
    ports:
      - "8085:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"

  redis:
    image: redis:7.2-alpine
    container_name: retainiq-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
